<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-p2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081726"/>
      <stop offset="100%" stop-color="#030910"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#grad-p2)"/>

  <!-- Computer Vision Coordinate Grid -->
  <g stroke="#0f334c" stroke-width="1" opacity="0.6">
    <line x1="50" y1="0" x2="50" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="350"/>
    <line x1="250" y1="0" x2="250" y2="350"/>
    <line x1="350" y1="0" x2="350" y2="350"/>
    <line x1="450" y1="0" x2="450" y2="350"/>
    <line x1="550" y1="0" x2="550" y2="350"/>
    <line x1="0" y1="70" x2="600" y2="70"/>
    <line x1="0" y1="175" x2="600" y2="175"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
  </g>

  <!-- Flight Path Spline -->
  <path d="M50 280 Q150 120 280 160 T520 90" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,6"/>
  
  <!-- Waypoints -->
  <circle cx="50" cy="280" r="6" fill="#0284c7" stroke="#fff" stroke-width="2"/>
  <circle cx="280" cy="160" r="6" fill="#0284c7" stroke="#fff" stroke-width="2"/>
  <circle cx="520" cy="90" r="8" fill="#22c55e" stroke="#fff" stroke-width="2"/>

  <!-- Drone in flight at center -->
  <g transform="translate(280, 160)">
    <ellipse cx="-35" cy="-20" rx="25" ry="6" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8"/>
    <ellipse cx="35" cy="-20" rx="25" ry="6" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8"/>
    <ellipse cx="-35" cy="20" rx="25" ry="6" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8"/>
    <ellipse cx="35" cy="20" rx="25" ry="6" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8"/>
    <line x1="-35" y1="-20" x2="35" y2="20" stroke="#94a3b8" stroke-width="4"/>
    <line x1="35" y1="-20" x2="-35" y2="20" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
  </g>

  <!-- OpenCV Object Detection Target Box -->
  <g transform="translate(460, 40)">
    <rect width="120" height="100" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3"/>
    <rect x="-2" y="-2" width="12" height="4" fill="#10b981"/>
    <rect x="-2" y="-2" width="4" height="12" fill="#10b981"/>
    <rect x="110" y="-2" width="12" height="4" fill="#10b981"/>
    <rect x="118" y="-2" width="4" height="12" fill="#10b981"/>
    <text x="8" y="20" font-family="monospace" font-weight="bold" font-size="11" fill="#34d399">TARGET 99.4%</text>
    <text x="8" y="36" font-family="monospace" font-size="10" fill="#6ee7b7">TRACKING: ON</text>
  </g>

  <!-- Telemetry HUD Overlay -->
  <g transform="translate(30, 30)">
    <rect width="160" height="75" rx="6" fill="#020617" fill-opacity="0.85" stroke="#0284c7" stroke-width="1.5"/>
    <text x="15" y="22" font-family="monospace" font-size="11" fill="#38bdf8">MAVLink: CONNECTED</text>
    <text x="15" y="40" font-family="monospace" font-size="11" fill="#cbd5e1">ALT: 12.4m  SPD: 4.8m/s</text>
    <text x="15" y="58" font-family="monospace" font-size="11" fill="#34d399">STATUS: AUTONOMOUS</text>
  </g>
</svg>