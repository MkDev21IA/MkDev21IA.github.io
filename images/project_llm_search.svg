<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="line-p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#grad-p1)"/>
  
  <!-- Subtle grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <line x1="0" y1="70" x2="600" y2="70"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="0" y1="210" x2="600" y2="210"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="150" y1="0" x2="150" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/>
    <line x1="450" y1="0" x2="450" y2="350"/>
  </g>

  <!-- Search Query Box Card -->
  <rect x="80" y="50" width="440" height="52" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="110" cy="76" r="9" stroke="#60a5fa" stroke-width="2.5" fill="none"/>
  <line x1="117" y1="83" x2="125" y2="91" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
  <text x="140" y="81" font-family="monospace" font-size="14" fill="#e2e8f0">Grounding query with verifiable citations...</text>

  <!-- Flow down arrows -->
  <path d="M300 102 V135" stroke="url(#line-p1)" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Source Cards Grid -->
  <g transform="translate(80, 140)">
    <!-- Source 1 -->
    <rect x="0" y="0" width="135" height="80" rx="8" fill="#182030" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="8" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1.5"/>
    <path d="M18 22 L21 25 L26 19" stroke="#22c55e" stroke-width="1.5" fill="none"/>
    <text x="38" y="26" font-family="sans-serif" font-weight="bold" font-size="11" fill="#4ade80">[Source 1]</text>
    <rect x="15" y="40" width="105" height="6" rx="3" fill="#334155"/>
    <rect x="15" y="52" width="80" height="6" rx="3" fill="#334155"/>
    <rect x="15" y="64" width="95" height="5" rx="2.5" fill="#22c55e" fill-opacity="0.6"/>

    <!-- Citation Link to Central Node -->
    <path d="M135 40 L180 40" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Central LLM Synthesizer -->
    <rect x="180" y="-10" width="80" height="100" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="220" y="25" font-family="sans-serif" font-weight="bold" font-size="12" fill="#c084fc" text-anchor="middle">LLM</text>
    <text x="220" y="42" font-family="sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">Search</text>
    <circle cx="220" cy="65" r="10" fill="#8b5cf6" fill-opacity="0.3" stroke="#c084fc" stroke-width="1.5"/>
    <text x="220" y="69" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">ADR</text>

    <!-- Citation Link to Source 2 -->
    <path d="M260 40 L305 40" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Source 2 -->
    <rect x="305" y="0" width="135" height="80" rx="8" fill="#182030" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="327" cy="22" r="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M323 22 L326 25 L331 19" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <text x="343" y="26" font-family="sans-serif" font-weight="bold" font-size="11" fill="#38bdf8">[Source 2]</text>
    <rect x="320" y="40" width="105" height="6" rx="3" fill="#334155"/>
    <rect x="320" y="52" width="90" height="6" rx="3" fill="#334155"/>
    <rect x="320" y="64" width="100" height="5" rx="2.5" fill="#38bdf8" fill-opacity="0.6"/>
  </g>

  <!-- Output Response Box -->
  <g transform="translate(120, 250)">
    <rect x="0" y="0" width="360" height="60" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
    <text x="20" y="25" font-family="monospace" font-size="11" fill="#93c5fd">Claim verified. [1] High fidelity context.</text>
    <text x="20" y="45" font-family="monospace" font-size="11" fill="#6ee7b7">Traceable attribution &amp; ADR compliance: 100%</text>
  </g>
</svg>