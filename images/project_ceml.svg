<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18122b"/>
      <stop offset="100%" stop-color="#0c0915"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#grad-p3)"/>

  <!-- Left: Circuit Schematic -->
  <g transform="translate(50, 60)">
    <text x="100" y="20" font-family="sans-serif" font-weight="bold" font-size="13" fill="#c084fc" text-anchor="middle" letter-spacing="1">ELECTRONIC CIRCUIT</text>
    <rect x="0" y="35" width="200" height="180" rx="8" fill="#1f1638" stroke="#a855f7" stroke-width="1.5"/>
    
    <!-- Schematic lines & components -->
    <!-- Resistor -->
    <path d="M20 90 H60 L65 80 L75 100 L85 80 L95 100 L105 80 L115 100 L120 90 H180" fill="none" stroke="#e879f9" stroke-width="2"/>
    <text x="90" y="72" font-family="monospace" font-size="11" fill="#f0abfc">R1 = 10k</text>
    
    <!-- Capacitor -->
    <line x1="100" y1="90" x2="100" y2="130" stroke="#e879f9" stroke-width="2"/>
    <line x1="85" y1="130" x2="115" y2="130" stroke="#e879f9" stroke-width="2.5"/>
    <line x1="85" y1="140" x2="115" y2="140" stroke="#e879f9" stroke-width="2.5"/>
    <line x1="100" y1="140" x2="100" y2="170" stroke="#e879f9" stroke-width="2"/>
    <text x="125" y="140" font-family="monospace" font-size="11" fill="#f0abfc">C1 = 1uF</text>
    
    <!-- Ground symbol -->
    <line x1="90" y1="170" x2="110" y2="170" stroke="#e879f9" stroke-width="2"/>
    <line x1="94" y1="175" x2="106" y2="175" stroke="#e879f9" stroke-width="2"/>
    <line x1="98" y1="180" x2="102" y2="180" stroke="#e879f9" stroke-width="2"/>
  </g>

  <!-- Transformation arrow in center -->
  <g transform="translate(270, 140)">
    <circle cx="30" cy="20" r="24" fill="#2e1065" stroke="#ec4899" stroke-width="2"/>
    <path d="M22 20 H38 M32 14 L38 20 L32 26" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round"/>
    <text x="30" y="58" font-family="monospace" font-weight="bold" font-size="10" fill="#f472b6" text-anchor="middle">IR COMPILER</text>
  </g>

  <!-- Right: CEML DSL Code Representation -->
  <g transform="translate(350, 60)">
    <text x="100" y="20" font-family="sans-serif" font-weight="bold" font-size="13" fill="#38bdf8" text-anchor="middle" letter-spacing="1">CEML DSL FORMAT</text>
    <rect x="0" y="35" width="200" height="180" rx="8" fill="#090d16" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="15" y="65" font-family="monospace" font-size="11" fill="#38bdf8">circuit LowPass {</text>
    <text x="25" y="90" font-family="monospace" font-size="11" fill="#f472b6">  node n_in, n_out;</text>
    <text x="25" y="115" font-family="monospace" font-size="11" fill="#4ade80">  R1: (n_in, n_out)</text>
    <text x="35" y="135" font-family="monospace" font-size="11" fill="#fbbf24">      val = 10k;</text>
    <text x="25" y="160" font-family="monospace" font-size="11" fill="#4ade80">  C1: (n_out, GND)</text>
    <text x="35" y="180" font-family="monospace" font-size="11" fill="#fbbf24">      val = 1uF;</text>
    <text x="15" y="202" font-family="monospace" font-size="11" fill="#38bdf8">}</text>
  </g>

  <!-- Bottom AI Reasoning Badge -->
  <rect x="150" y="290" width="300" height="35" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="300" y="312" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c7d2fe" text-anchor="middle">AI-Driven Circuit Symbolic Solver &amp; Modeling</text>
</svg>