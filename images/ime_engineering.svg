<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-ime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2430"/>
      <stop offset="50%" stop-color="#191e2b"/>
      <stop offset="100%" stop-color="#0d111a"/>
    </linearGradient>
    <linearGradient id="accent-ime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e95ff"/>
      <stop offset="100%" stop-color="#27d7a4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#grad-ime)"/>
  
  <!-- Circuit Grid Lines -->
  <g stroke="#2a3348" stroke-width="1.5" opacity="0.6">
    <line x1="50" y1="100" x2="350" y2="100"/>
    <line x1="50" y1="200" x2="350" y2="200"/>
    <line x1="50" y1="300" x2="350" y2="300"/>
    <line x1="100" y1="50" x2="100" y2="350"/>
    <line x1="200" y1="50" x2="200" y2="350"/>
    <line x1="300" y1="50" x2="300" y2="350"/>
  </g>
  
  <!-- Circuit Paths -->
  <g stroke="url(#accent-ime)" stroke-width="3" fill="none" filter="url(#glow)">
    <path d="M80 120 H160 L200 160 V240 L240 280 H320"/>
    <path d="M320 120 H240 L200 160"/>
    <path d="M80 280 H160 L200 240"/>
    <circle cx="80" cy="120" r="5" fill="#27d7a4"/>
    <circle cx="320" cy="120" r="5" fill="#4e95ff"/>
    <circle cx="80" cy="280" r="5" fill="#27d7a4"/>
    <circle cx="320" cy="280" r="5" fill="#4e95ff"/>
    <circle cx="200" cy="160" r="6" fill="#ffffff"/>
    <circle cx="200" cy="240" r="6" fill="#ffffff"/>
  </g>

  <!-- Central Chip / Shield -->
  <rect x="150" y="150" width="100" height="100" rx="16" fill="#1a2233" stroke="url(#accent-ime)" stroke-width="3" filter="url(#glow)"/>
  <rect x="165" y="165" width="70" height="70" rx="10" fill="#131a27"/>
  
  <!-- Graduation / University & Electronic symbol inside -->
  <path d="M175 195 L200 180 L225 195 L200 210 Z" fill="none" stroke="#27d7a4" stroke-width="2.5"/>
  <path d="M183 200 V216 C183 224 217 224 217 216 V200" fill="none" stroke="#4e95ff" stroke-width="2"/>
  <circle cx="225" cy="205" r="2" fill="#27d7a4"/>
  <line x1="225" y1="195" x2="225" y2="215" stroke="#27d7a4" stroke-width="1.5"/>

  <text x="200" y="345" font-family="sans-serif" font-weight="bold" font-size="14" fill="#a5b4fc" text-anchor="middle" letter-spacing="3">INSTITUTO MILITAR DE ENGENHARIA</text>
  <text x="200" y="365" font-family="sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" letter-spacing="2">ELECTRONIC ENGINEERING</text>
</svg>