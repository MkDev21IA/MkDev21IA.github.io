<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-selvia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181528"/>
      <stop offset="50%" stop-color="#201535"/>
      <stop offset="100%" stop-color="#0d0b17"/>
    </linearGradient>
    <linearGradient id="accent-selvia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cyan-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow-selvia" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#grad-selvia)"/>

  <!-- Neural / RAG feedback loop background rings -->
  <g fill="none" stroke="#382952" stroke-width="1.5" opacity="0.5">
    <circle cx="200" cy="180" r="110" stroke-dasharray="4,6"/>
    <circle cx="200" cy="180" r="70" stroke-dasharray="6,6"/>
  </g>

  <!-- Flow Arrows / Feedback Loop -->
  <g fill="none" stroke="url(#accent-selvia)" stroke-width="2.5" filter="url(#glow-selvia)">
    <path d="M140 140 C170 100, 230 100, 260 140" stroke-dasharray="120"/>
    <path d="M260 220 C230 260, 170 260, 140 220" stroke-dasharray="120"/>
    <!-- Arrow heads -->
    <polygon points="262,145 250,135 258,130" fill="#ec4899"/>
    <polygon points="138,215 150,225 142,230" fill="#a855f7"/>
  </g>

  <!-- Nodes in the Feedback Loop -->
  <!-- Context Retrieval Node -->
  <circle cx="130" cy="180" r="26" fill="#1e1b38" stroke="#06b6d4" stroke-width="2.5" filter="url(#glow-selvia)"/>
  <text x="130" y="185" font-family="monospace" font-weight="bold" font-size="12" fill="#06b6d4" text-anchor="middle">RAG</text>
  
  <!-- LLM & Evaluation Node -->
  <circle cx="200" cy="120" r="28" fill="#2a1b40" stroke="url(#accent-selvia)" stroke-width="3" filter="url(#glow-selvia)"/>
  <text x="200" y="125" font-family="monospace" font-weight="bold" font-size="12" fill="#f472b6" text-anchor="middle">LLM</text>

  <!-- Diagnostics Node -->
  <circle cx="270" cy="180" r="26" fill="#1e1b38" stroke="#ec4899" stroke-width="2.5" filter="url(#glow-selvia)"/>
  <text x="270" y="185" font-family="monospace" font-weight="bold" font-size="11" fill="#ec4899" text-anchor="middle">EVAL</text>

  <!-- ELT / Cloud Data Node -->
  <circle cx="200" cy="240" r="24" fill="#161c2e" stroke="#3b82f6" stroke-width="2" filter="url(#glow-selvia)"/>
  <text x="200" y="245" font-family="monospace" font-weight="bold" font-size="10" fill="#60a5fa" text-anchor="middle">ELT</text>

  <!-- Connection Lines to Central Brain -->
  <line x1="156" y1="180" x2="244" y2="180" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>

  <!-- Cloud / AWS Badge at top right -->
  <g transform="translate(305, 45)" opacity="0.85">
    <rect width="55" height="22" rx="5" fill="#ff9900" fill-opacity="0.15" stroke="#ff9900" stroke-width="1"/>
    <text x="27" y="15" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ff9900" text-anchor="middle">AWS</text>
  </g>

  <!-- Text Info -->
  <text x="200" y="335" font-family="sans-serif" font-weight="bold" font-size="15" fill="#e0e7ff" text-anchor="middle" letter-spacing="4">SELVIA</text>
  <text x="200" y="358" font-family="sans-serif" font-size="11" fill="#c084fc" text-anchor="middle" letter-spacing="1.5">DATA ENGINEERING &amp; AI SOLUTIONS</text>
</svg>