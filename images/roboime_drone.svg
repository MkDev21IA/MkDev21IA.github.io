<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-drone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c24"/>
      <stop offset="50%" stop-color="#0e2638"/>
      <stop offset="100%" stop-color="#071017"/>
    </linearGradient>
    <linearGradient id="accent-drone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow-drone" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#grad-drone)"/>

  <!-- Radar / Telemetry Grid -->
  <g stroke="#164e63" stroke-width="1" opacity="0.4" fill="none">
    <circle cx="200" cy="170" r="115" stroke-dasharray="3,5"/>
    <circle cx="200" cy="170" r="80"/>
    <circle cx="200" cy="170" r="45"/>
    <line x1="200" y1="45" x2="200" y2="295"/>
    <line x1="75" y1="170" x2="325" y2="170"/>
  </g>

  <!-- Drone Quadcopter Body -->
  <!-- Arms -->
  <line x1="130" y1="100" x2="270" y2="240" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
  <line x1="270" y1="100" x2="130" y2="240" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Rotors (4 circles) with blur -->
  <ellipse cx="130" cy="100" rx="35" ry="10" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-15 130 100)"/>
  <ellipse cx="270" cy="100" rx="35" ry="10" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" transform="rotate(15 270 100)"/>
  <ellipse cx="130" cy="240" rx="35" ry="10" fill="#059669" fill-opacity="0.3" stroke="#34d399" stroke-width="1.5" transform="rotate(15 130 240)"/>
  <ellipse cx="270" cy="240" rx="35" ry="10" fill="#059669" fill-opacity="0.3" stroke="#34d399" stroke-width="1.5" transform="rotate(-15 270 240)"/>

  <!-- Motors -->
  <circle cx="130" cy="100" r="8" fill="#0ea5e9"/>
  <circle cx="270" cy="100" r="8" fill="#0ea5e9"/>
  <circle cx="130" cy="240" r="8" fill="#10b981"/>
  <circle cx="270" cy="240" r="8" fill="#10b981"/>

  <!-- Center Fuselage / Autopilot Flight Controller -->
  <rect x="175" y="145" width="50" height="50" rx="10" fill="#0f172a" stroke="url(#accent-drone)" stroke-width="2.5" filter="url(#glow-drone)"/>
  <circle cx="200" cy="170" r="12" fill="#0284c7" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2"/>
  <!-- Camera Lens -->
  <circle cx="200" cy="170" r="5" fill="#38bdf8"/>

  <!-- Vision HUD crosshair brackets -->
  <path d="M165 140 H155 V150" stroke="#34d399" stroke-width="2" fill="none"/>
  <path d="M235 140 H245 V150" stroke="#34d399" stroke-width="2" fill="none"/>
  <path d="M165 200 H155 V190" stroke="#34d399" stroke-width="2" fill="none"/>
  <path d="M235 200 H245 V190" stroke="#34d399" stroke-width="2" fill="none"/>

  <!-- Vision Cone -->
  <polygon points="190,195 210,195 275,275 125,275" fill="url(#accent-drone)" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="200" y="335" font-family="sans-serif" font-weight="bold" font-size="15" fill="#f0fdf4" text-anchor="middle" letter-spacing="4">ROBOIME</text>
  <text x="200" y="358" font-family="sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">DRONE TEAM LEAD &amp; AUTONOMY</text>
</svg>